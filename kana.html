<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese — Hiragana &amp; Katakana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root {
    --bg: #faf6ef;
    --card-bg: #ffffff;
    --ink: #2b2420;
    --muted: #726a60;
    --accent: #c0392b;
    --accent2: #1f6f5c;
    --accent-soft: #fbe9e6;
    --accent2-soft: #e4f2ee;
    --line: #ecdfd0;
    --unit-bg: linear-gradient(135deg, #2b2420 0%, #44352c 100%);
    --unit-bg-hover: linear-gradient(135deg, #3a2f28 0%, #54433687 100%);
    --gold: #c89b3c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(192,57,43,0.06) 0%, transparent 45%),
      radial-gradient(circle at 85% 92%, rgba(31,111,92,0.06) 0%, transparent 45%);
    color: var(--ink);
    line-height: 1.6;
    padding: 24px 12px 80px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  header.page-head {
    text-align: center;
    margin-bottom: 30px;
    padding: 28px 20px 24px;
    background: linear-gradient(135deg, #2b2420 0%, #4a3a30 100%);
    border-radius: 16px;
    color: #fdf6ee;
    box-shadow: 0 6px 20px rgba(43,36,32,0.25);
    position: relative;
    overflow: hidden;
  }
  header.page-head::before {
    content: "🎏 🌸 ⛩️ 🗻 🎎";
    position: absolute;
    top: -6px; left: 0; right: 0;
    text-align: center;
    font-size: 1.3rem;
    opacity: 0.18;
    letter-spacing: 18px;
  }
  header.page-head h1 {
    font-family: "Zen Maru Gothic", "Inter", sans-serif;
    font-size: 2rem;
    margin: 6px 0 8px;
    letter-spacing: 0.3px;
    position: relative;
  }
  header.page-head p {
    color: #e8d9c8;
    margin: 0;
    font-size: 0.95rem;
    position: relative;
  }
  header.page-head .badges {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
  }
  header.page-head .badges span {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 0.8rem;
  }

  /* ===== Profile bar + progress ===== */
  .profile-bar {
    max-width: 1100px;
    margin: 14px auto 0;
    padding: 10px 18px;
    background: #fff;
    border: 1px solid rgba(192,57,43,0.18);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.9rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .profile-bar .pb-name {
    font-weight: 700;
    color: var(--accent);
  }
  .profile-bar .pb-progress {
    flex: 1 1 160px;
    min-width: 140px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .profile-bar .pb-bar-track {
    flex: 1;
    height: 8px;
    border-radius: 999px;
    background: #eee5d8;
    overflow: hidden;
  }
  .profile-bar .pb-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--accent2));
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .profile-bar .pb-pct {
    font-size: 0.8rem;
    color: #777;
    white-space: nowrap;
  }
  .profile-bar button {
    background: none;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 0.8rem;
    cursor: pointer;
    color: #666;
  }
  .profile-bar button:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .profile-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(40,30,20,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
  }
  .profile-modal {
    background: #fff;
    border-radius: 14px;
    padding: 28px 30px;
    max-width: 360px;
    width: 90%;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .profile-modal h3 {
    margin: 0 0 6px;
    font-family: 'Zen Maru Gothic', sans-serif;
    color: var(--accent);
  }
  .profile-modal p {
    color: #777;
    font-size: 0.88rem;
    margin: 0 0 16px;
  }
  .profile-modal input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 1rem;
    margin-bottom: 14px;
  }
  .profile-modal button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .profile-modal button:hover { background: #a53224; }
  .unit {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 18px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(43,36,32,0.07);
    transition: box-shadow 0.2s ease;
  }
  .unit:hover { box-shadow: 0 4px 16px rgba(43,36,32,0.12); }
  .unit-toggle {
    width: 100%;
    text-align: left;
    background: var(--unit-bg);
    color: #fff;
    border: none;
    padding: 18px 22px;
    font-size: 1.15rem;
    font-weight: 700;
    font-family: "Zen Maru Gothic", "Inter", sans-serif;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: filter 0.15s ease;
  }
  .unit-toggle:hover { filter: brightness(1.12); }
  .unit-toggle .arrow {
    transition: transform 0.2s ease;
    font-size: 0.85rem;
    color: var(--gold);
  }
  .unit-toggle.open .arrow { transform: rotate(90deg); }
  .unit-body {
    display: none;
    padding: 20px 22px 26px;
  }
  .unit-body.open { display: block; }

  .section {
    margin-bottom: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .section-toggle {
    width: 100%;
    text-align: left;
    background: var(--accent-soft);
    color: var(--accent);
    border: none;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.15s ease;
  }
  .section-toggle:hover { background: #f6dbd6; }
  .section-toggle .arrow { transition: transform 0.2s ease; font-size: 0.8rem; }
  .section-toggle.open .arrow { transform: rotate(90deg); }
  .section-body { display: none; padding: 18px 18px 20px; }
  .section-body.open { display: block; }

  h3.sub { font-size: 1.03rem; margin: 20px 0 8px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
  h3.sub:first-child { margin-top: 0; }

  ul.goals { margin: 0; padding-left: 22px; }
  ul.goals li { margin-bottom: 5px; }
  ul.goals li::marker { color: var(--accent); }

  table.vocab {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.95rem;
    margin-top: 8px;
    border-radius: 8px;
    overflow: hidden;
  }
  table.vocab th, table.vocab td {
    border: 1px solid var(--line);
    padding: 9px 12px;
    text-align: left;
  }
  table.vocab th {
    background: var(--accent2);
    color: #fff;
    font-weight: 600;
  }
  table.vocab tr:nth-child(even) td { background: #fbf7f1; }
  table.vocab tr:hover td { background: var(--accent2-soft); }

  .grammar-point {
    margin-bottom: 18px;
    padding: 12px 14px;
    background: #fdfbf8;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .grammar-point .jp { font-weight: 700; color: var(--accent); }
  .grammar-point .en { color: var(--ink); }
  .grammar-point .note { color: var(--muted); font-style: italic; font-size: 0.9rem; }
  .example-box {
    background: var(--accent2-soft);
    border-left: 3px solid var(--accent2);
    padding: 8px 12px;
    margin: 8px 0;
    border-radius: 4px;
    font-size: 0.93rem;
  }
  .example-box::before { content: "💡 "; }

  .dialog-box {
    background: #fdfbf8;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 14px;
    position: relative;
  }
  .dialog-box h4 { margin: 0 0 10px; font-size: 0.95rem; color: var(--accent); display: flex; align-items: center; gap: 6px; }
  .dialog-box h4::before { content: "💬"; }
  .dialog-line { margin: 6px 0; padding: 4px 0; }
  .dialog-line .speaker {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    margin-right: 8px;
    background: var(--accent2);
    color: #fff;
    border-radius: 999px;
    width: 22px; height: 22px;
    font-size: 0.78rem;
  }

  .exercise {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--line);
  }
  .exercise:last-child { border-bottom: none; margin-bottom: 0; }
  .exercise .ex-title { font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .exercise ol { margin: 0; padding-left: 20px; }
  .exercise li { margin-bottom: 10px; }
  .exercise input[type="text"] {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 0.93rem;
    width: 220px;
    margin-left: 6px;
  }
  .exercise input[type="text"]:focus { outline: 2px solid var(--accent2); }
  .exercise select {
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .check-btn, .reveal-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: transform 0.1s ease, opacity 0.1s ease;
  }
  .check-btn:hover, .reveal-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .feedback { margin-left: 10px; font-weight: 700; font-size: 0.88rem; }
  .feedback.correct { color: #1f6f3f; }
  .feedback.correct::before { content: "✅ "; }
  .feedback.wrong { color: var(--accent); }
  .answer-key {
    display: none;
    margin-top: 8px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 8px 10px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .answer-key.open { display: block; }

  .match-row { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; }
  .match-row select {
    padding: 4px 6px;
    border-radius: 5px;
    border: 1px solid var(--line);
    font-size: 0.9rem;
  }

  .culture-box {
    background: linear-gradient(135deg, #fdf2e3 0%, #fbe8d6 100%);
    border: 1px solid #f0d9b5;
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 0.95rem;
    position: relative;
  }
  .culture-box::before { content: "⛩️ "; font-size: 1.1rem; }

  .progress-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 30px;
  }

  /* ===== Two-pane layout ===== */
  .wrap { max-width: 1400px; }
  .layout {
    display: flex;
    gap: 22px;
    align-items: flex-start;
  }
  .sidebar {
    flex: 0 0 30%;
    max-width: 30%;
    min-width: 280px;
  }
  .lecture {
    flex: 1 1 70%;
    min-width: 0;
    position: sticky;
    top: 16px;
    max-height: calc(100vh - 32px);
    overflow-y: auto;
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 4px 18px rgba(43,36,32,0.10);
    padding: 26px 30px 30px;
  }
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar, .lecture { flex: 1 1 100%; max-width: 100%; }
    .lecture { position: static; max-height: none; order: -1; margin-bottom: 24px; }
  }

  .lecture-placeholder {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  .lecture-placeholder .big { font-size: 2.4rem; display: block; margin-bottom: 10px; }

  .lecture-crumb {
    font-size: 0.82rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 4px;
  }
  .lecture-title {
    font-family: "Zen Maru Gothic", "Inter", sans-serif;
    font-size: 1.5rem;
    color: var(--ink);
    margin: 0 0 18px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--accent-soft);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .lecture-block { margin-bottom: 22px; }
  .lecture-block h4 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent2);
    margin: 0 0 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lecture-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    position: sticky;
    bottom: 0;
    background: var(--card-bg);
  }
  .lecture-nav button {
    background: var(--unit-bg);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lecture-nav button:disabled { opacity: 0.35; cursor: default; }
  .lecture-nav button:not(:disabled):hover { filter: brightness(1.15); }
  .lecture-dots {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .lecture-dots span {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--line);
    display: inline-block;
    cursor: pointer;
  }
  .lecture-dots span.active { background: var(--accent); }
  .lecture-dots span.culture-dot { background: var(--gold); }

  .lecture .culture-box { margin-top: 4px; }
  .lecture .dialog-box, .lecture .grammar-point, .lecture .exercise { font-size: 0.95rem; }

  /* ===== v2 additions ===== */
  
  .mode-switch { max-width: 1100px; margin: 14px auto 0; display: flex; gap: 6px; padding: 5px; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .mode-switch a { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 4px 10px; flex-wrap: wrap; text-decoration: none; background: transparent; color: var(--muted); padding: 10px 14px; border-radius: 10px; font-family: "Inter", sans-serif; font-size: 0.95rem; font-weight: 600; transition: background .15s ease, color .15s ease; }
    .mode-switch a small { font-weight: 500; font-size: 0.75rem; opacity: 0.85; }
    .mode-switch a .ms-icon { font-family: "Zen Maru Gothic", "Noto Serif JP", sans-serif; font-size: 1.25rem; line-height: 1; }
    .mode-switch a[aria-current="page"] { background: var(--unit-bg); color: #fff; cursor: default; }
    .mode-switch a[aria-current="page"] small { color: var(--gold); opacity: 1; }
    .mode-switch a:not([aria-current="page"]):hover { background: var(--accent-soft); color: var(--accent); }
    .mode-switch .ms-label { align-self: center; padding: 0 8px 0 10px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: .5px; color: #8a7f72; white-space: nowrap; }
    @media (max-width: 640px) { .mode-switch { flex-wrap: wrap; } .mode-switch .ms-label { flex: 1 1 100%; padding: 2px 8px; } .mode-switch a { flex: 1 1 100%; } }
  
  .sidebar { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 2px; }
  .course-nav { display: flex; flex-direction: column; gap: 10px; }
  .nav-item {
    text-align: left; width: 100%; cursor: pointer;
    background: var(--card-bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;
    box-shadow: 0 2px 8px rgba(43,36,32,0.06);
    font-family: inherit; transition: box-shadow .15s ease, border-color .15s ease, transform .1s ease;
  }
  .nav-item:hover { box-shadow: 0 4px 14px rgba(43,36,32,0.12); transform: translateY(-1px); }
  .nav-item.active { background: var(--unit-bg); color: #fff; border-color: transparent; }
  .nav-item .ni-title { font-family: "Zen Maru Gothic", "Inter", sans-serif; font-weight: 700; font-size: 1rem; line-height: 1.35; }
  .nav-item .ni-meta { font-size: 0.78rem; opacity: 0.7; }
  .nav-item .ni-bar { height: 4px; border-radius: 999px; background: rgba(120,100,80,0.18); overflow: hidden; margin-top: 2px; }
  .nav-item .ni-bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent2)); }
  .nav-item.cp { background: var(--accent2-soft); border-style: dashed; border-color: var(--accent2); }
  .nav-item.cp.active { background: var(--accent2); color: #fff; border-style: solid; }
  .progress-note { margin-top: 18px; }

  .script-switch { display: inline-flex; align-items: center; gap: 0; border: 1px solid #ddd; border-radius: 999px; overflow: hidden; background: #faf6ef; }
  .script-switch .ss-label { font-size: 0.72rem; color: #8a7f72; padding: 0 8px 0 12px; text-transform: uppercase; letter-spacing: .4px; }
  .profile-bar .script-switch button { border: none; border-radius: 0; padding: 6px 12px; background: none; color: #666; }
  .profile-bar .script-switch button.on { background: var(--accent); color: #fff; }
  .profile-bar .pb-save { font-size: 0.76rem; color: #6c8a7b; white-space: nowrap; }

  .script-tag { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 0.75rem; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 8px; }
  td.jp-cell, .q-jp, .jp-cell { font-family: "Zen Maru Gothic", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; }
  td.jp-cell { font-size: 1.08rem; font-weight: 700; color: var(--accent); }
  .exercise li, .q-opts .opt { font-family: inherit; }
  .exercise input[lang="ja"], .exercise input[data-lang="jp"] { font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", "Inter", sans-serif; }

  .lecture-nav button.alt { background: var(--accent2); }
  .lecture-dots span.recap-dot { background: var(--accent2); opacity: .55; }
  .lecture-dots span.recap-dot.active { opacity: 1; }

  .recap-intro { color: var(--muted); font-size: 0.93rem; margin: 0 0 12px; }
  .recap-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; cursor: pointer; }
  table.recap td.spk-cell { width: 44px; text-align: center; padding: 4px; }
  button.spk { background: var(--accent2-soft); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 0.85rem; padding: 3px 9px; }
  button.spk:hover { background: #d3eae3; }
  button.spk.big { font-size: 0.95rem; padding: 6px 14px; font-weight: 600; margin-right: 6px; }
  #recapTbl.hide-en td.en-cell { filter: blur(6px); transition: filter .15s ease; }
  #recapTbl.hide-en tr:hover td.en-cell { filter: none; }
  .recap-done {
    margin-top: 20px; padding: 14px 16px; border-radius: 10px;
    background: linear-gradient(135deg, #e4f2ee 0%, #f3f9f6 100%);
    border: 1px solid #b9dccf; font-size: 0.95rem;
  }
  .recap-done .check-btn { margin: 6px 0 0 8px; }

  .cp-score { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fdfbf8; font-size: 0.9rem; position: sticky; top: 0; z-index: 3; }
  .cp-score .pb-bar-track { flex: 1 1 140px; height: 8px; border-radius: 999px; background: #eee5d8; overflow: hidden; }
  .cp-score .pb-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--accent2)); transition: width .3s ease; }
  .q { padding: 12px 14px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fdfbf8; }
  .q-prompt { margin-bottom: 8px; font-size: 0.97rem; }
  .q-jp { font-weight: 700; font-size: 1.15rem; color: var(--accent); }
  .q-en { font-weight: 600; }
  .q-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt {
    background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px;
    font-size: 0.95rem; cursor: pointer; color: var(--ink);
  }

'use strict';
/* =========================================================
   DATABASE — same browser database as the other pages
   (IndexedDB, with a localStorage mirror as fallback)
   ========================================================= */
const DB_NAME = 'japanese_a1_db', DB_STORE = 'kv', KEY = 'kana_progress', LS_KEY = 'ja_kana_v1';
let dbP = null;
function openDb() {
  if (dbP) return dbP;
  dbP = new Promise(function(res) {
    if (!window.indexedDB) { res(null); return; }
    let rq;
    try { rq = indexedDB.open(DB_NAME, 1); } catch (e) { res(null); return; }
    rq.onupgradeneeded = function() { if (!rq.result.objectStoreNames.contains(DB_STORE)) rq.result.createObjectStore(DB_STORE); };
    rq.onsuccess = function() { res(rq.result); };
    rq.onerror = rq.onblocked = function() { res(null); };
  });
  return dbP;
}
function dbGet(k) {
  return openDb().then(function(db) { return new Promise(function(res) {
    if (!db) { res(undefined); return; }
    try { const r = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(k); r.onsuccess = function() { res(r.result); }; r.onerror = function() { res(undefined); }; } catch (e) { res(undefined); }
  }); });
}
function dbSet(k, v) {
  return openDb().then(function(db) { return new Promise(function(res) {
    if (!db) { res(false); return; }
    try { const tx = db.transaction(DB_STORE, 'readwrite'); tx.objectStore(DB_STORE).put(v, k); tx.oncomplete = function() { res(true); }; tx.onerror = tx.onabort = function() { res(false); }; } catch (e) { res(false); }
  }); });
}

function buildWords(txt, script) {
  return txt.split('\n').map(function(line) {
    const p = line.split('|'), units = parseUnits(p[0]);
    if (units.some(function(u) { return u.l == null; })) { console.warn('unknown char in word', p[0]); return null; }
    const req = Math.max.apply(null, units.map(function(u) { return u.l; }).concat([p[2] ? +p[2] : 0]));
    if (script === 'hira' && req > 16) return null;
    return { k: p[0], en: p[1], units: units, req: req, rom: kanaToRom(p[0], true), script: script };
  }).filter(Boolean);
}

function normalizeProgress(p) {
  const d = { mastery: { hira: {}, kata: {} }, lessons: {}, view: { script: 'hira', t: 'lesson', i: 0 }, stats: { speed: {} } };
  if (!p || typeof p !== 'object') return d;
  if (p.mastery) { d.mastery.hira = p.mastery.hira || {}; d.mastery.kata = p.mastery.kata || {}; }
  d.lessons = p.lessons || {};
  d.view = p.view || d.view;
  d.stats = p.stats || d.stats; d.stats.speed = d.stats.speed || {};
  return d;
}
function scheduleSave() {
  setBadge('saving');
  clearTimeout(saveT);
  saveT = setTimeout(saveNow, 350);
}
function saveNow() {
  clearTimeout(saveT);
  progress.view = { script: ST.script, t: ST.t === 'session' ? 'lesson' : ST.t, i: ST.i };
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) {}
  return dbSet(KEY, progress).then(function(ok) { setBadge(ok ? 'saved' : 'local'); });
}
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', function() { if (document.hidden) saveNow(); });
function setBadge(m) {
  const b = document.getElementById('pbSave'); if (!b) return;
  b.textContent = m === 'saving' ? '… saving' : m === 'local' ? '💾 saved in this browser' : '💾 saved';
}
function mget(script, k) { return progress.mastery[script][k] || { ok: 0, bad: 0 }; }
function lvl(m) { if (!m.ok) return 0; const s = m.ok - m.bad; return s >= 6 ? 3 : s >= 3 ? 2 : 1; }
function isWeak(script, k) { const m = mget(script, k); return m.bad > 0 && lvl(m) < 2; }
function record(script, k, ok) {
  const m = progress.mastery[script][k] || (progress.mastery[script][k] = { ok: 0, bad: 0 });
  if (ok) m.ok++; else m.bad++;
  m.t = Date.now();
  scheduleSave();
}
function lessonLevel(script, L) {
  if (!L.chars.length) { const r = progress.lessons[script + L.i]; return r && r.done ? 1 : 0; }
  let s = 0; L.chars.forEach(function(c) { s += lvl(mget(script, c.k)); });
  return s / (L.chars.length * 3);
}
function overall(script) {
  let learned = 0, total = 0;
  LESSONS[script].forEach(function(L) { L.chars.forEach(function(c) { if (c.rare) return; total++; if (lvl(mget(script, c.k)) >= 2) learned++; }); });
  return { learned: learned, total: total };
}

const $ = function(s, r) { return (r || document).querySelector(s); };
function esc(s) { return String(s).replace(/[&<>"]/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function rnd(n) { return Math.floor(Math.random() * n); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const canSpeak = 'speechSynthesis' in window;
function speak(t) {
  if (!canSpeak) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 0.8;
    const v = speechSynthesis.getVoices().filter(function(v) { return /^ja/i.test(v.lang); })[0];
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

   ========================================================= */
function makePad(host, text, guideOn) {
  const size = 240, dpr = window.devicePixelRatio || 1;
  host.innerHTML = '<div class="pad"><canvas class="pad-cv"></canvas><div class="pad-btns">' +
    '<button type="button" data-a="clear">🧹 Clear</button><button type="button" data-a="guide" class="' + (guideOn ? 'on' : '') + '">👁 Guide</button>' +
    '<button type="button" data-a="model">✅ Show answer</button></div></div>';
  const cv = $('canvas', host), g = cv.getContext('2d');
  cv.width = size * dpr; cv.height = size * dpr;
  g.scale(dpr, dpr);
  let guide = !!guideOn, model = false, strokes = [], cur = null;
  const fs = text.length > 1 ? 112 : 180;
  const font = '700 ' + fs + 'px "Zen Maru Gothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif';
  function glyph(color) {
    g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = color;
    g.fillText(text, size / 2, size / 2 + fs * 0.06);
  }
  function redraw() {
    g.clearRect(0, 0, size, size);
    g.save(); g.strokeStyle = '#ecdfd0'; g.setLineDash([5, 5]); g.lineWidth = 1;
    g.beginPath(); g.moveTo(size / 2, 6); g.lineTo(size / 2, size - 6); g.moveTo(6, size / 2); g.lineTo(size - 6, size / 2); g.stroke(); g.restore();
    if (guide) glyph('rgba(150,140,130,.22)');
    g.strokeStyle = '#2b2420'; g.lineWidth = 9; g.lineCap = 'round'; g.lineJoin = 'round';
    strokes.forEach(function(s) {
      g.beginPath(); g.moveTo(s[0].x, s[0].y);
      if (s.length === 1) g.lineTo(s[0].x + 0.1, s[0].y);
      for (let i = 1; i < s.length; i++) g.lineTo(s[i].x, s[i].y);
      g.stroke();
    });
    if (model) glyph('rgba(192,57,43,.38)');
  }
  function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * size / r.width, y: (e.clientY - r.top) * size / r.height }; }
  cv.addEventListener('pointerdown', function(e) { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} cur = [pos(e)]; strokes.push(cur); redraw(); });
  cv.addEventListener('pointermove', function(e) { if (!cur) return; cur.push(pos(e)); redraw(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function(n) { cv.addEventListener(n, function() { cur = null; }); });
  host.addEventListener('click', function(e) {
    const b = e.target.closest('button[data-a]'); if (!b || !host.contains(b)) return;
    if (b.dataset.a === 'clear') { strokes = []; model = false; $('[data-a=model]', host).classList.remove('on'); }
    if (b.dataset.a === 'guide') { guide = !guide; b.classList.toggle('on', guide); }
    if (b.dataset.a === 'model') { model = !model; b.classList.toggle('on', model); b.textContent = model ? '🙈 Hide answer' : '✅ Show answer'; }
    redraw();
  });
  redraw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
  return { reveal: function() { model = true; const b = $('[data-a=model]', host); b.classList.add('on'); b.textContent = '🙈 Hide answer'; redraw(); } };
}

function distract(ch, pool, mode, n) {
  n = n || 3;
  const seen = {}; seen[mode === 'r' ? ch.r : ch.k] = 1;
  const out = [];
  const usable = pool.filter(function(c) { return !c.rare && !c.notype || mode === 'k' && !c.rare; });
  function add(c) {
    const key = mode === 'r' ? c.r : c.k;
    if (seen[key] || out.length >= n) return;
    if (mode === 'k' && c.r === ch.r) return;
    seen[key] = 1; out.push(c);
  }
  if (mode === 'k') shuffle(simOf(ch, usable)).forEach(add);
  shuffle(usable).forEach(add);
  return shuffle([ch].concat(out));
}
function kl(k) { return '<span class="kq-k">' + esc(k) + '</span>'; }

function mcBlock(host, api, o) {
  host.innerHTML = (o.big ? '<div class="kq-big ' + (o.cls || '') + '">' + o.big + '</div>' : '') +
    (o.audio ? '<button class="kq-say" type="button">🔊 Play sound</button>' : '') +
    '<div class="kq-ask">' + o.ask + '</div>' +
    '<div class="q-opts kq-opts">' + o.opts.map(function(x, i) { return '<button class="opt" type="button" data-i="' + i + '">' + x.label + '</button>'; }).join('') + '</div>';
  const btns = Array.prototype.slice.call(host.querySelectorAll('.opt'));
  if (o.audio) { $('.kq-say', host).onclick = function() { speak(o.audio); }; setTimeout(function() { speak(o.audio); }, 200); }
  btns.forEach(function(b, i) {
    b.onclick = function() {
      const ok = o.opts[i].ok;
      btns.forEach(function(bb, j) { bb.disabled = true; if (o.opts[j].ok) bb.classList.add('right'); });
      if (!ok) b.classList.add('wrong');
      api.done(ok, o.fb);
    };
  });
}
function typeBlock(host, api, o) {
  host.innerHTML = (o.big ? '<div class="kq-big ' + (o.cls || '') + '">' + o.big + '</div>' : '') +
    (o.audio ? '<button class="kq-say" type="button">🔊 Play sound</button>' : '') +
    '<div class="kq-ask">' + o.ask + '</div>' +
    '<div class="q-row"><input type="text" class="kq-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + esc(o.ph || '') + '"><button class="check-btn" type="button">Check</button></div>' +
    (o.tip ? '<div class="kq-tip">' + o.tip + '</div>' : '');
  const inp = $('.kq-in', host); let comp = false, fin = false;
  if (o.audio) { $('.kq-say', host).onclick = function() { speak(o.audio); }; setTimeout(function() { speak(o.audio); }, 200); }
  function fix() { if (o.lang !== 'jp' || comp) return; const v = romajiToKana(inp.value, o.script, false); if (v !== inp.value) inp.value = v; }
  inp.addEventListener('compositionstart', function() { comp = true; });
  inp.addEventListener('compositionend', function() { comp = false; fix(); });
  inp.addEventListener('input', fix);
  function submit() {
    if (fin) return;
    let v = inp.value.trim();
    if (o.lang === 'jp') v = romajiToKana(v, o.script, true);
    if (!v) return;
    fin = true; inp.disabled = true; inp.value = v;
    $('.check-btn', host).disabled = true;
    api.done(!!o.check(v), o.fb(v));
  }
  $('.check-btn', host).onclick = submit;
  inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
  setTimeout(function() { try { inp.focus(); } catch (e) {} }, 60);
}

/* ---- set assembly ---- */
const READ_KINDS = ['c2r', 'listen', 'r2c', 'c2rT', 'match', 'wordMC', 'xs', 'c2r', 'listen', 'wordT', 'r2c', 'match', 'c2rT', 'wordMC', 'listen', 'c2r', 'wordT', 'r2c', 'xs', 'match'];
const WRITE_KINDS = ['r2cT', 'draw', 'wordW', 'r2cT', 'tiles', 'draw', 'fill', 'r2cT', 'wordW', 'draw', 'r2cT', 'tiles', 'fill', 'draw', 'r2cT', 'wordW', 'r2cT', 'tiles', 'draw', 'fill'];
const TEST_KINDS = ['c2r', 'r2cT', 'listen', 'wordMC', 'r2c', 'wordW', 'c2rT', 'tiles', 'match', 'fill', 'wordT', 'xs'];
const MIX_KINDS = ['c2r', 'r2cT', 'listen', 'draw', 'wordMC', 'r2c', 'wordW', 'match', 'c2rT', 'tiles', 'xs', 'fill', 'wordT'];

function makeCtx(script, idxs) {
  const Ls = LESSONS[script], upto = Math.max.apply(null, idxs);
  const pool = []; Ls.slice(0, upto + 1).forEach(function(L) { L.chars.forEach(function(c) { pool.push(c); }); });
  const targets = []; idxs.forEach(function(i) { Ls[i].chars.forEach(function(c) { targets.push(c); }); });
  const words = WORDS[script].filter(function(w) { return w.req <= upto; });
  const fresh = words.filter(function(w) { return idxs.indexOf(w.req) >= 0; });
  return { script: script, pool: pool, targets: targets, words: words, fresh: fresh, idxs: idxs };
}
function charBag(ctx, weak) {

      const m = mget(ctx.script, c.k), w = weak ? (isWeak(ctx.script, c.k) ? 3 : lvl(m) >= 3 ? 1 : 2) : 1;
      return new Array(w).fill(c);

    else if (WORD_KINDS[kind]) { const w = nw(); if (w) q = { wordMC: qWordMC, wordT: qWordT, wordW: qWordW, tiles: qTiles, fill: qFill }[kind](ctx, w); }
    else { const c = nx(); if (c) q = { c2r: qC2R, r2c: qR2C, listen: qListen, xs: qXS, c2rT: qC2RT, r2cT: qR2CT, draw: qDraw }[kind](ctx, c); }

  }

/* ---- starting the different practice modes ---- */
function lessonSession(kind, script, i) {
  const L = LESSONS[script][i], upto = [];
  for (let j = 0; j <= i; j++) upto.push(j);
  const crumb = sName(script) + ' · Lesson ' + (i + 1);
  ST.i = i;
  const cfg0 = { script: script, idxs: [i], crumb: crumb, back: function() { go('lesson', i); } };
  function go1() {
    let qs, title;
    if (kind === 'read') { qs = buildSet(makeCtx(script, [i]), READ_KINDS, 20, true); title = '📖 Reading practice'; }
    else if (kind === 'write') { qs = buildSet(makeCtx(script, [i]), WRITE_KINDS, 20, true); title = '✍️ Writing practice'; }
    else if (kind === 'mix') { const c = makeCtx(script, upto); qs = buildSet(c, MIX_KINDS, 24, true); title = '🎲 Mixed review · Lessons 1–' + (i + 1); cfg0.idxs = upto; }
    else { qs = buildSet(makeCtx(script, [i]), TEST_KINDS, 24, true); title = '🏁 Lesson test'; cfg0.test = true; cfg0.lesson = i; }
    const cfg = Object.assign({}, cfg0, { title: title, qs: qs, again: go1 });
    startSession(cfg);
  }
  go1();
}
function customSession() {
  const script = ST.script, idxs = Object.keys(PR.sel).filter(function(k) { return PR.sel[k]; }).map(Number).sort(function(a, b) { return a - b; });
  if (!idxs.length) { alert('Pick at least one lesson.'); return; }
  const ctx = makeCtx(script, idxs);
  if (PR.weak) { const w = ctx.targets.filter(function(c) { return isWeak(script, c.k); }); if (w.length) ctx.targets = w; }
  const kinds = PR.type === 'read' ? READ_KINDS : PR.type === 'write' ? WRITE_KINDS : MIX_KINDS;
  function again() {
    startSession({ title: '🎯 Custom practice', crumb: sName(script) + ' · Practice', script: script, idxs: idxs, qs: buildSet(ctx, kinds, PR.n, true), back: function() { go('practice', 0); }, again: again });
  }
  again();
}
function speedSession() {
  const script = ST.script, all = []; LESSONS[script].forEach(function(L) { all.push(L.i); });
  const learnedIdx = all.filter(function(i) { return LESSONS[script][i].chars.some(function(c) { return mget(script, c.k).ok > 0; }) });
  const idxs = learnedIdx.length ? learnedIdx : [0];
  const ctx = makeCtx(script, idxs);
  ctx.pool = ctx.pool.filter(function(c) { return idxs.indexOf(c.lesson) >= 0 || true; });

  }

}

  const seg = ['hira', 'kata'].map(function(s) { return '<button class="' + (ST.script === s ? 'on' : '') + '" onclick="setScript(\'' + s + '\')">' + (s === 'hira' ? 'あ Hiragana' : 'ア Katakana') + '</button>'; }).join('');
  bar.innerHTML = '<span>👋 <span class="pb-name">' + esc(userName || 'Student') + '</span></span>' +
    '<div class="pb-progress"><div class="pb-bar-track"><div class="pb-bar-fill" style="width:' + p + '%"></div></div><span class="pb-pct">' + o.learned + ' / ' + o.total + ' characters learned</span></div>' +
    '<div class="script-switch" title="Choose the script to study">' + seg + '</div><span class="pb-save" id="pbSave"></span><button onclick="resetKana()">🔄 Reset</button>';
  setBadge('saved');
}
function resetKana() {
  if (!confirm('Reset ALL hiragana & katakana progress? This cannot be undone.')) return;
  progress = normalizeProgress(null); ST = { script: ST.script, t: 'lesson', i: 0 };
  saveNow().then(render);
}
function renderNav() {
  const s = ST.script, Ls = LESSONS[s];
  let h = '<button class="nav-item tool ' + (ST.t === 'chart' ? 'active' : '') + '" onclick="go(\'chart\')"><div class="ni-title">📋 ' + sName(s) + ' chart</div><div class="ni-meta">All characters · tap to hear</div></button>' +
    '<button class="nav-item tool ' + (ST.t === 'practice' ? 'active' : '') + '" onclick="go(\'practice\')"><div class="ni-title">🎯 Practice &amp; speed round</div><div class="ni-meta">Mix lessons · weak characters · timed</div></button>';
  let grp = null;
  Ls.forEach(function(L) {
    if (L.group && L.group !== grp) { grp = L.group; h += '<div class="nav-group">' + esc(grp) + '</div>'; }
    const r = progress.lessons[s + L.i], act = (ST.t === 'lesson' || ST.t === 'session') && ST.i === L.i;
    const kanaPrev = L.chars.slice(0, 5).map(function(c) { return c.k; }).join(' ');
    h += '<button class="nav-item ' + (act ? 'active' : '') + '" onclick="go(\'lesson\',' + L.i + ')"><div class="ni-row"><div class="ni-title">' + (L.i + 1) + '. ' + esc(L.title) + '</div>' +
      (r && r.done ? '<span class="ni-done">✓</span>' : '') + '</div>' + (kanaPrev ? '<div class="ni-kana">' + esc(kanaPrev) + (L.chars.length > 5 ? ' …' : '') + '</div>' : '') +
      '<div class="ni-bar"><span style="width:' + Math.round(lessonLevel(s, L) * 100) + '%"></span></div></button>';
  });
  $('#courseNav').innerHTML = h;
  $('#sideNote').textContent = s === 'hira' ? 'Hiragana: the base script — grammar words and native Japanese. Pass each lesson test (80%) to earn a ✓.' : 'Katakana: the same sounds, used for foreign words and names. Pass each lesson test (80%) to earn a ✓.';
}

function renderLesson(i) {
  const s = ST.script, Ls = LESSONS[s]; if (i >= Ls.length) i = ST.i = 0;
  const L = Ls[i], r = progress.lessons[s + i];
  const fresh = L.words, earlier = WORDS[s].filter(function(w) { return w.req < i; });
  function wrow(w) { return '<tr><td class="kw-k" onclick="speak(\'' + w.k + '\')">' + esc(w.k) + '</td><td class="kw-r">' + esc(w.rom) + '</td><td>' + esc(w.en) + '</td></tr>'; }
  const hook = s === 'hira' ? MN_H : MN_K;
  let h = '<div class="lecture-crumb">' + sName(s) + ' · Lesson ' + (i + 1) + ' of ' + Ls.length + '</div>' +
    '<h2 class="lecture-title">' + (L.chars.length ? '<span class="jp" style="color:var(--accent)">' + esc(L.chars.slice(0, 5).map(function(c) { return c.k; }).join('')) + '</span>' : '') + esc(L.title) + (r && r.done ? ' <span class="script-tag">✓ passed ' + r.best + '%</span>' : '') + '</h2>';
  if (L.note) h += '<div class="k-note">💡 ' + L.note + '</div>';
  if (i === 16 && s === 'kata') h += '<div class="lecture-block"><h4>Two special marks</h4><div class="kana-grid"><div class="kcard" onclick="speak(\'ベッド\')"><div class="kc-ch">ッ</div><div class="kc-r">small tsu</div><div class="kc-m">doubles the next consonant<br>ベッド bed<br>beddo</div></div><div class="kcard" onclick="speak(\'ビール\')"><div class="kc-ch">ー</div><div class="kc-r">long mark</div><div class="kc-m">lengthens the vowel<br>ビール beer<br>bīru</div></div></div></div>';
  if (i === 16 && s === 'hira') h += '<div class="lecture-block"><h4>Special sounds</h4><div class="kana-grid"><div class="kcard" onclick="speak(\'きって\')"><div class="kc-ch">っ</div><div class="kc-r">small tsu</div><div class="kc-m">doubles the next consonant<br>きって kitte "stamp"</div></div><div class="kcard" onclick="speak(\'おかあさん\')"><div class="kc-ch">ああ</div><div class="kc-r">long vowel</div><div class="kc-m">repeat the vowel<br>おかあさん okaasan</div></div><div class="kcard" onclick="speak(\'とうきょう\')"><div class="kc-ch">おう</div><div class="kc-r">long o</div><div class="kc-m">o + う also = ō<br>とうきょう Tōkyō</div></div></div></div>';
  if (L.chars.length) {
    h += '<div class="lecture-block"><h4>🔤 Characters <span style="text-transform:none;font-weight:400;color:var(--muted)">· tap a card to hear it</span></h4><div class="kana-grid" style="' + (L.cols === 3 ? 'grid-template-columns:repeat(auto-fill,minmax(104px,1fr))' : '') + '">' +
      L.chars.map(function(c) {
        const m = mget(s, c.k);
        return '<button class="kcard" type="button" onclick="speak(\'' + c.k + '\')"><div class="kc-ch">' + esc(c.k) + '</div><div class="kc-r">' + esc(c.r) + '</div><div class="kc-m">' + (hook[c.h] || (c.lesson >= 10 && c.lesson <= 12 ? 'sound of ' + esc(baseOf(c.h) ? (s === 'hira' ? baseOf(c.h) : toKata(baseOf(c.h))) : '') + ' + ' + (/[ぱぴぷぺぽ]/.test(c.h) ? '゜' : '゛') : '')) + '</div><div class="kc-s">' + stars(m) + '</div></button>';
      }).join('') + '</div></div>';
    h += '<div class="lecture-block"><h4>✍️ Write it</h4><div class="pad-chips" id="padChips">' +
      L.chars.filter(function(c) { return !c.rare; }).map(function(c, j) { return '<button type="button" data-k="' + esc(c.k) + '" class="' + (j === 0 ? 'on' : '') + '">' + esc(c.k) + '</button>'; }).join('') + '</div><div class="pad-info"><div id="padHost"></div><div class="pad-side" id="padSide"></div></div></div>';
  }
  h += '<div class="lecture-block"><h4>📖 Words you can read ' + (fresh.length ? '' : '<span style="text-transform:none;font-weight:400;color:var(--muted)">· none new here</span>') + '</h4>';
  if (fresh.length) h += '<table class="k-words">' + fresh.map(wrow).join('') + '</table>';
  if (earlier.length) h += '<details class="k-more"><summary>More words with earlier characters (' + earlier.length + ')</summary><table class="k-words">' + earlier.map(wrow).join('') + '</table></details>';
  if (!fresh.length && !earlier.length) h += '<p style="color:var(--muted);font-size:.9rem">Words appear here as soon as you know enough characters. Practise these characters first!</p>';
  h += '</div>';
  h += '<div class="lecture-block"><h4>🏋️ Practice</h4><div class="k-actions">' +
    '<button class="k-act" onclick="lessonSession(\'read\',\'' + s + '\',' + i + ')"><b>📖 Reading practice</b><small>Choose, listen, match, read words · 20 questions</small></button>' +
    '<button class="k-act" onclick="lessonSession(\'write\',\'' + s + '\',' + i + ')"><b>✍️ Writing practice</b><small>Type, draw, build and complete words · 20 questions</small></button>' +
    (i > 0 ? '<button class="k-act" onclick="lessonSession(\'mix\',\'' + s + '\',' + i + ')"><b>🎲 Mixed review</b><small>Lessons 1–' + (i + 1) + ' together · 24 questions</small></button>' : '') +
    '<button class="k-act test" onclick="lessonSession(\'test\',\'' + s + '\',' + i + ')"><b>🏁 Lesson test</b><small>' + (r ? 'Best ' + r.best + '% · ' + r.tries + ' tr' + (r.tries > 1 ? 'ies' : 'y') + ' · ' : '') + 'Score 80% to pass</small></button></div></div>';
  h += '<div class="lecture-nav"><button ' + (i === 0 ? 'disabled' : 'onclick="go(\'lesson\',' + (i - 1) + ')"') + '>← Previous</button>' +
    '<span style="color:var(--muted);font-size:.85rem">' + (i + 1) + ' / ' + Ls.length + '</span><button ' + (i >= Ls.length - 1 ? 'disabled' : 'onclick="go(\'lesson\',' + (i + 1) + ')"') + '>Next →</button></div>';
  const pane = $('#lecturePane'); pane.innerHTML = h; pane.scrollTop = 0;
  if (L.chars.length) {
    const first = L.chars.filter(function(c) { return !c.rare; })[0];
    const showPad = function(k) {
      const c = CHAR_BY_KEY[s + ':' + k], m = mget(s, k);
      makePad($('#padHost'), k, lvl(m) < 2);
      $('#padSide').innerHTML = '<div class="ps-r">' + esc(c.r) + '</div><div style="color:var(--muted);margin-bottom:8px">' + (hook[c.h] ? esc(hook[c.h]) : '') + '</div><button class="k-btn" type="button" onclick="speak(\'' + k + '\')">🔊 Hear it</button>' +
        '<p style="font-size:.82rem;color:var(--muted);max-width:260px">Say the sound out loud while you draw. Turn the guide off once you can write it from memory.</p>';
    };
    showPad(first.k);
    $('#padChips').onclick = function(e) { const b = e.target.closest('button'); if (!b) return; Array.prototype.forEach.call($('#padChips').children, function(x) { x.classList.toggle('on', x === b); }); showPad(b.dataset.k); };
  }
}

function renderChart() {
  const s = ST.script, Ls = LESSONS[s];
  let h = '<div class="lecture-crumb">' + sName(s) + '</div><h2 class="lecture-title">📋 ' + sName(s) + ' chart</h2>' +
    '<div class="legend"><span><i style="background:#fff"></i>new</span><span><i style="background:#fff7dd"></i>seen</span><span><i style="background:#e4f2ea"></i>learned</span><span><i style="background:#c9e8d6"></i>mastered</span><span>· tap any cell to hear it</span></div>';
  function cell(c) { return c ? '<button class="cc l' + lvl(mget(s, c.k)) + '" type="button" onclick="speak(\'' + c.k + '\')"><span class="cc-ch jp">' + esc(c.k) + '</span><span class="cc-r">' + esc(c.r) + '</span></button>' : '<span class="cc e"></span>'; }
  let grp = null;
  Ls.forEach(function(L) {
    if (!L.chars.length) return;
    if (L.group && L.group !== grp) { if (grp) h += '</div>'; grp = L.group; h += '<div class="chart-sec"><h4 style="color:var(--accent2);text-transform:uppercase;font-size:.85rem;letter-spacing:.5px;margin:0 0 8px">' + esc(grp) + '</h4>'; }
    const cols = L.cols === 3 ? 3 : 5;
    h += '<div class="chart-grid" style="grid-template-columns:repeat(' + cols + ',1fr);margin-bottom:6px">';
    if (L.lay) L.lay.forEach(function(row) { for (let j = 0; j < 5; j++) h += cell(row[j] >= 0 && row[j] !== undefined ? L.chars[row[j]] : null); });
    else L.chars.forEach(function(c) { h += cell(c); });
    h += '</div>';
  });
  if (grp) h += '</div>';
  $('#lecturePane').innerHTML = h;
}

function renderPractice() {
  const s = ST.script, Ls = LESSONS[s], o = overall(s), sp = progress.stats.speed[s] || 0;
  if (!Object.keys(PR.sel).length) Ls.forEach(function(L) { PR.sel[L.i] = lessonLevel(s, L) > 0 || L.i === 0; });
  const weakN = [].concat.apply([], Ls.map(function(L) { return L.chars; })).filter(function(c) { return isWeak(s, c.k); }).length;
  let h = '<div class="lecture-crumb">' + sName(s) + '</div><h2 class="lecture-title">🎯 Practice &amp; speed round</h2>' +
    '<div class="lecture-block"><h4>⚡ Speed round</h4><p style="margin:0 0 10px;font-size:.92rem">60 seconds. Read or find as many characters as you can. Best score: <b>' + sp + '</b></p><button class="kq-next" onclick="speedSession()">Start speed round</button></div>' +
    '<div class="lecture-block"><h4>🎯 Custom practice</h4>' +
    '<div class="pr-row"><label>Lessons to include</label><div class="pr-chips" id="prSel">' + Ls.map(function(L) { return '<button type="button" data-i="' + L.i + '" class="' + (PR.sel[L.i] ? 'on' : '') + '">' + (L.i + 1) + '. ' + esc(L.title) + '</button>'; }).join('') + '</div>' +
    '<button class="k-btn" type="button" id="prAll">Select all</button> <button class="k-btn" type="button" id="prNone">Clear</button></div>' +
    '<div class="pr-row"><label>Type</label><div class="pr-chips" id="prType">' + [['mixed', '🎲 Mixed'], ['read', '📖 Reading'], ['write', '✍️ Writing']].map(function(x) { return '<button type="button" data-v="' + x[0] + '" class="' + (PR.type === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('') + '</div></div>' +
    '<div class="pr-row"><label>Questions</label><div class="pr-chips" id="prN">' + [10, 20, 30, 50].map(function(n) { return '<button type="button" data-v="' + n + '" class="' + (PR.n === n ? 'on' : '') + '">' + n + '</button>'; }).join('') + '</div></div>' +
    '<div class="pr-row"><label><input type="checkbox" id="prWeak" ' + (PR.weak ? 'checked' : '') + '> Focus on my weak characters <span class="hint">(' + weakN + ' right now)</span></label></div>' +
    '<button class="kq-next" onclick="customSession()">Start practice</button></div>';
  $('#lecturePane').innerHTML = h;
  $('#prSel').onclick = function(e) { const b = e.target.closest('button'); if (!b) return; PR.sel[b.dataset.i] = !PR.sel[b.dataset.i]; b.classList.toggle('on', PR.sel[b.dataset.i]); };
  $('#prAll').onclick = function() { Ls.forEach(function(L) { PR.sel[L.i] = true; }); renderPractice(); };
  $('#prNone').onclick = function() { Ls.forEach(function(L) { PR.sel[L.i] = false; }); renderPractice(); };
  $('#prType').onclick = function(e) { const b = e.target.closest('button'); if (!b) return; PR.type = b.dataset.v; Array.prototype.forEach.call($('#prType').children, function(x) { x.classList.toggle('on', x === b); }); };
  $('#prN').onclick = function(e) { const b = e.target.closest('button'); if (!b) return; PR.n = +b.dataset.v; Array.prototype.forEach.call($('#prN').children, function(x) { x.classList.toggle('on', x === b); }); };
  $('#prWeak').onchange = function() { PR.weak = this.checked; };
}

/* =========================================================
   INIT
   ========================================================= */
(function init() {
  if (canSpeak) { try { speechSynthesis.getVoices(); } catch (e) {} }
  const qp = /[?&]s=(hira|kata)/.exec(location.search);
  Promise.all([dbGet(KEY), dbGet('progress')]).then(function(r) {
    let p = r[0];
    if (!p) { try { p = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { p = null; } }
    progress = normalizeProgress(p);
    userName = (r[1] && r[1].name) || '';
    const v = progress.view || {};
    ST = { script: qp ? qp[1] : (v.script === 'kata' ? 'kata' : 'hira'), t: v.t === 'chart' || v.t === 'practice' ? v.t : 'lesson', i: v.i || 0 };
    if (qp && v.script !== qp[1]) { ST.t = 'lesson'; ST.i = 0; }
    if (ST.i >= LESSONS[ST.script].length) ST.i = 0;
    render();
  });
})();
</script>
</body>
</html>
